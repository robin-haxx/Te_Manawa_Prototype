<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Te Manawa geography skeleton. Run `node tools/svg2geo.js` after any edit (md/TEMANAWA_GEOGRAPHY.md).
       Tributaries are drawn SOURCE → MOUTH and named (data-name). Sources sit well past the map edge
       (y −150 / x 1850 / y 1040: the map ends at about y −53, x 1695, y 953, and a fan stream
       beside a source must start off the map too) or inside a range, never on the plain.
       Confluence order down the Manawatū (Wikipedia): Mangatewainui, Tīraumea, Mangatainoka,
       Mangahao, Pohangina, Ōroua, Tokomaru; plus the Tamaki and Mangatoro (upper river), the
       Kiwitea (into the Ōroua) and the Mākākahi (into the Mangatainoka). Redrawn 2026-10-20.
       The west-side four (Pohangina, Ōroua, Kiwitea, Tokomaru) moved inland 2026-11-06: the interglacial
       sea reaches x 520–600 here (by seed), so the Ōroua and Tokomaru keep east of it and join the main
       rather than running to the sea, and the Pohangina hugs the Ruahine foot to the gorge (Ashhurst).
       The ranges are drawn AS THEY STAND on the map (LOOK.flipRangeAxis false), traced from the real
       topography: two ridges on the NE–SW axial line whose points meet at the gorge, their edges stepped
       for a cartoon read. The outline is the range BODY; the crest grades out across broad foothills past
       it (LOOK.rangeCrestOut), so draw it about as wide as the high ground. Redrawn 2026-11-03. -->
  <rect x="2" y="2" width="1596" height="896" fill="none" stroke="#ccc" stroke-width="2"/>
  <!-- TARARUA, south of the gorge: a point at the gorge, broadening SSW into a massif down a stepped west face -->
  <polygon class="range" data-height="0.90" data-spread="0.18" points="794.6 478.2 782.1 490.2 742.8 525.5 719.5 550.6 678.4 590.9 664.0 619.0 621.1 651.2 606.8 686.5 567.4 711.6 535.2 751.9 510.2 787.1 474.4 812.2 442.2 857.5 410.0 902.8 374.3 953.1 299.1 1204.7 835.8 1204.7 773.2 953.1 760.6 902.8 746.3 852.5 757.1 812.2 742.8 761.9 753.5 721.7 778.5 686.5 764.2 651.2 782.1 611.0 800.0 570.7 812.5 530.5 810.7 495.3"/>
  <!-- RUAHINE, north of the gorge: a narrow ridge leaning NE from a point at the gorge to the north-east corner -->
  <polygon class="range" data-height="0.91" data-spread="0.16" points="1157.8 -304.7 1050.4 -73.2 1036.1 -12.9 1018.2 17.3 975.3 77.7 964.6 117.9 918.1 168.3 900.2 218.6 885.9 248.8 850.1 309.1 839.4 349.4 821.5 389.6 814.3 419.8 817.9 450.0 839.4 439.9 871.6 409.8 907.3 379.6 921.6 339.3 961.0 299.1 1000.4 258.8 1018.2 208.5 1059.4 168.3 1100.5 117.9 1114.8 67.6 1157.8 17.3 1157.8 -33.0 1184.6 -73.2 1300.9 -304.7"/>
  <polyline class="river" data-width="0.05" data-depth="1.0" fill="none" points="150,470 300,525 430,562 560,540 660,470 765,432 845,470 945,545 1055,548 1140,472 1226,360 1306,250 1366,176"/>

  <!-- WEST of the ranges: the Manawatū plain -->
  <polyline class="tributary" data-name="Pohangina" data-width="0.016" fill="none" stroke="#2a6" points="950,-150 920,-70 890,20 858,110 822,200 790,290 770,370 760,415 752,437"/>
  <polyline class="tributary" data-name="Ōroua" data-width="0.018" fill="none" stroke="#2a6" points="735,-150 727,-70 719,10 709,90 697,175 686,255 676,335 669,405 667,445 668,467"/>
  <polyline class="tributary" data-name="Kiwitea" data-width="0.013" fill="none" stroke="#2a6" points="850,-150 830,-70 812,10 792,90 768,170 740,232 710,258 684,270"/>
  <polyline class="tributary" data-name="Tokomaru" data-width="0.013" fill="none" stroke="#2a6" points="700,820 702,770 688,722 664,684 648,640 646,590 632,540 625,494"/>

  <!-- EAST of the ranges: the upper Manawatū and the Tararua-side rivers -->
  <polyline class="tributary" data-name="upper Manawatū" data-width="0.018" fill="none" stroke="#26a" points="1128,-150 1150,-70 1175,20 1205,95 1195,175 1165,260 1135,350 1105,440 1088,500 1084,547"/>
  <polyline class="tributary" data-name="Mangatewainui" data-width="0.013" fill="none" stroke="#26a" points="1466,-150 1420,-70 1380,0 1320,50 1260,85 1205,100"/>
  <polyline class="tributary" data-name="Tamaki" data-width="0.013" fill="none" stroke="#26a" points="1000,140 1050,180 1110,212 1176,230"/>
  <polyline class="tributary" data-name="Mangatoro" data-width="0.013" fill="none" stroke="#26a" points="1850,225 1710,250 1600,270 1480,300 1360,320 1260,320 1150,305"/>
  <polyline class="tributary" data-name="Tīraumea" data-width="0.018" fill="none" stroke="#26a" points="1850,870 1710,800 1590,740 1470,670 1350,590 1240,520 1160,470 1104,445"/>
  <polyline class="tributary" data-name="Mangatainoka" data-width="0.018" fill="none" stroke="#26a" points="972,1040 980,970 990,880 1010,800 1005,720 990,650 985,590 985,546"/>
  <polyline class="tributary" data-name="Mākākahi" data-width="0.013" fill="none" stroke="#26a" points="1148,1040 1130,970 1110,890 1080,820 1040,760 1005,724"/>
  <polyline class="tributary" data-name="Mangahao" data-width="0.015" fill="none" stroke="#26a" points="700,900 760,820 820,740 870,660 900,590 905,515"/>
</svg>
