<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Avian Age: Te Manawa</title>

    <!-- p5.min.js: esbuild-minified from vendored p5.js v1.11.11 (5.4 MB -> 1.4 MB) —
         p5 was the largest item in the cold-boot budget. Full p5.js kept for debugging.
         Regenerate: npx esbuild p5.js --minify --legal-comments=none --outfile=p5.min.js -->
    <script src="p5.min.js"></script>
    <script src="p5.sound.min.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <main></main>

    <!-- ==================================================================
         Avian Age: TE MANAWA — standalone museum installation.
         An ambient top-down diorama; the parent engine's economy is stripped
         (no currency, toolbar, goals, win/lose). The play area is a letterboxed
         grid, adaptive by default (CONFIG.terrainFit).

         See md/TEMANAWA_PLAN_V3.md for the design spine and phase status, and
         md/TEMANAWA_BUILD_V3.md for architecture and budgets.
         ================================================================== -->

    <!-- Kiosk layer: watchdog, idle/attract, soft reset, error capture.
         Loads first so its error handlers are armed before anything else. -->
    <script src="TeManawa_kiosk.js"></script>

    <!-- Ambience and effects -->
    <script src="TeManawa_audio.js"></script>

    <!-- Core systems -->
    <script src="TeManawa_registry.js"></script>
    <script src="TeManawa_spatial.js"></script>
    <script src="TeManawa_simulation.js"></script>

    <!-- Data definitions -->
     <script src="TeManawa_plant_defs.js"></script>
    <script src="TeManawa_species_data.js"></script>
    <script src="TeManawa_entity_sprites.js"></script>

    <!-- Geography skeleton (SVG-authored via tools/svg2geo.js). Optional; the
         terrain reshapes its base noise around it. See md/TEMANAWA_GEOGRAPHY.md. -->
    <script src="geo/manawatu.geo.js"></script>

    <!-- Terrain and seasons/climate -->
    <script src="TeManawa_terrain.js"></script>
    <!-- Plan-oblique 3/4 projection. Pure module (like climate.js); loads after
         terrain so the sim/HUD/render can read it at runtime. -->
    <script src="TeManawa_projection.js"></script>
    <script src="TeManawa_seasons.js"></script>

    <!-- Animated water overlay + its texture loader. SpriteStrips loads one strip
         PNG per animation (md/TEMANAWA_BUILD_V3.md §2.4); WaterLayer stamps river
         flow / eels / sea shimmer over the baked terrain each frame, reading
         Projection + terrain.waterTypeAt(). atlas before water (water uses it). -->
    <script src="TeManawa_atlas.js"></script>
    <script src="TeManawa_water.js"></script>

    <!-- Base classes -->
    <script src="TeManawa_boid.js"></script>

    <!-- Entities -->
    <script src="TeManawa_moa.js"></script>
    <!-- North Island goose (Cnemiornis): a moa-guild grazer — extends Moa, so it MUST
         load after moa.js. Registered as a `moa`-type species; makes the cold phase busier. -->
    <script src="TeManawa_goose.js"></script>
    <!-- Mōho / North Island takahē (Porphyrio mantelli): another moa-guild grazer —
         extends Moa (load after moa.js). Territorial rail; NOT the SI takahē. -->
    <script src="TeManawa_takahe.js"></script>
    <script src="TeManawa_eagle.js"></script>
    <!-- Kererū: the large-seed disperser (extends Boid; behave/update/render). Loads after
         boid.js; disperses forest seedlings at runtime. md/TEMANAWA_INTERACTION_HEALTH_PLAN.md §3 -->
    <script src="TeManawa_kereru.js"></script>
    <!-- Kōkako + huia: the other flighted forest birds. Both EXTEND Kereru (short-flight
         frugivore loop, >50% less seed dispersal), so they MUST load after kereru.js.
         Kōkako sing + hold territory; huia forage as male+female pairs. -->
    <script src="TeManawa_kokako.js"></script>
    <script src="TeManawa_huia.js"></script>
    <script src="TeManawa_egg.js"></script>
    <script src="TeManawa_plant.js"></script>
    <script src="TeManawa_placeable.js"></script>

    <!-- Runtime texture atlas: packs all loaded sprite PNGs (fauna, flora,
         weather) into a few shared GPU pages at setup() and wraps image() so the
         cast draws from them transparently. Must load after every sprite-holding
         module above and before sketch.js (which calls SpriteAtlas.build()). -->
    <script src="TeManawa_spriteatlas.js"></script>

    <!-- Optional WebGL entity-sprite layer (?render=gl). Draws the sprite cast as
         batched textured quads on an offscreen GL canvas sourced from the atlas
         pages, composited back into the 2D frame. Default off; needs the atlas, so
         load after it and before sketch.js. -->
    <script src="TeManawa_glbatch.js"></script>

    <!-- Deep time + parametric climate. Pure modules, no p5 dependency;
         must load before the HUD, which renders from them. -->
    <script src="TeManawa_climate.js"></script>
    <script src="TeManawa_time.js"></script>

    <!-- Installation HUD: deep-time timeline, five buttons, storm/ash FX.
         Must load before TeManawa_UI.js, which reads InstallHUD.TOP_H. -->
    <script src="TeManawa_hud.js"></script>

    <!-- Debug overlay (press D) -->
    <script src="TeManawa_debug.js"></script>

    <!-- Plant sprite gallery (hold D 3 s) — full-screen sprite-scale debug view.
         After debug.js: a short D tap is replayed to Debug; a hold toggles this. -->
    <script src="TeManawa_plant_debug.js"></script>

    <!-- UI host: notification strip, delegates the HUD to InstallHUD -->
    <script src="TeManawa_UI.js"></script>

    <!-- Level system -->
    <script src="TeManawa_level_format.js"></script>

    <!-- Level definition — the Manawatū scene -->
    <script src="levels/level_temanawa_scaffold.js"></script>

    <!-- Dev console tools (LOOK / GEN / DEV) — authoring only. Loads after
         terrain.js so it can extend LOOK; see md/TEMANAWA_DEVTOOLS.md. -->
    <script src="TeManawa_devtools.js"></script>

    <!-- Main game (owns setup()/draw()) — must load last -->
    <script src="TeManawa_sketch.js"></script>
  </body>
</html>
