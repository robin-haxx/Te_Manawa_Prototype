<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Te Manawa — Console</title>
<link rel="stylesheet" href="secondscreen.css">
</head>
<body>

<!-- The fixed 1920×1080 stage. app.js scales it to the panel. -->
<div id="stage">

  <div id="bg" class="theme-select"></div>

  <!-- ============ CENTRE: "Select a Habitat" attract ============ -->
  <div id="selectScreen">
    <div id="selectCard">
      <!-- the Te Manawa mark (white on transparent). The landing card is not a touch target, so
           it shows the logo; the "Tap a Plant!" card below keeps the hand-touch glyph. -->
      <img class="logo" src="../sprites/UI/Logo/Logo_Ink_00.svg" alt="" aria-hidden="true"
           onerror="this.style.visibility='hidden'">
      <h1>Habitat Explorer</h1>
      <div class="prompt-sub"><b>Move the switch on the left,</b></div>
      <div class="prompt-sub">And uncover the ancient secrets of the Manawatū...</div>
      
    </div>
  </div>

  <!-- ============ HABITAT screen (forest/wetland/lowland/alpine) ============ -->
  <div id="habitatScreen" class="hidden">
    <h1 id="habitatTitle">Forest Habitat</h1>
    <div id="plantCluster"></div>

    <div id="card">
      <!-- prompt state -->
      <div id="cardPrompt">
        <img class="hand" src="assets/hand.png" alt="" aria-hidden="true"
             onerror="this.style.visibility='hidden'">
        <div class="prompt-title">Tap a Plant!</div>
        <div class="prompt-sub">Every native plant has a story to tell...</div>
      </div>
      <!-- species state -->
      <div id="cardSpecies" class="hidden">
        <!-- the head: the name on the left; on the right, the plant with the bird(s) it feeds as
             one little scene (the big sprite is already highlighted in the cluster on the left) -->
        <div id="cardHead">
          <div id="cardTitle">
            <h2 id="cardName"></h2>
            <div id="cardSci"></div>
          </div>
          <div id="cardScene">
            <div id="cardSceneBox">
              <div id="cardPlantClip"><img id="cardPlant" alt=""></div>
              <div id="cardFauna"></div>
            </div>
          </div>
        </div>
        <!-- the write-up: touch-scrolls; a fade at the bottom says there is more -->
        <div id="cardBody"></div>
        <!-- shown only while the write-up has more below (app.js updateMore); a tap scrolls it -->
        <div id="cardMore"><span class="chev" aria-hidden="true"></span>Scroll for more</div>
      </div>
    </div>
  </div>

  <!-- ============ readout: KYA · stage · goal · timelapse ============ -->
  <div id="readout">
    <span id="clockLabel">waiting for the diorama…</span>
    <span id="stagePill" class="pill">—</span>
    <span id="goalLabel"></span>
    <span id="timelapse">
      <span id="timelapseTrack"><span id="timelapseFill"></span></span>
      <span id="timelapseMsg"></span>
    </span>
  </div>

  <!-- ============ optional on-screen test controls (?controls=1) ============ -->
  <div id="testbar">
    <button data-action="habitatUp">▲ habitat</button>
    <button data-action="habitatDown">▼ habitat</button>
    <button data-action="plantPrev">◀ plant</button>
    <button data-action="plantNext">plant ▶</button>
    <button data-action="storm">STORM</button>
    <button data-action="boost">BOOST</button>
    <button data-action="eruption">ERUPTION</button>
  </div>

</div>

<!-- load order: data + bus + input before the app -->
<script src="encyclopedia.js"></script>
<script src="bus.js"></script>
<script src="input.js"></script>
<script src="app.js"></script>
</body>
</html>
