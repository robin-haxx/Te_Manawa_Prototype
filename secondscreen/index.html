<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Te Manawa — Console</title>
<link rel="stylesheet" href="secondscreen.css">
</head>
<body>

<!-- The fixed 1920×1080 stage. app.js scales it to the panel. -->
<div id="stage">

  <div id="bg" class="theme-select"></div>

  <!-- ============ CENTRE: "Select a Habitat" attract ============ -->
  <div id="selectScreen">
    <div id="selectCard">
      <!-- hand-touch asset. Drop the final art at secondscreen/assets/hand.png (or tell me the
           name/format and I'll repoint src). Hidden until present, so no broken-image icon. -->
      <img class="hand" src="assets/hand.png" alt="" aria-hidden="true"
           onerror="this.style.visibility='hidden'">
      <h1>Select a Habitat</h1>
      <div class="prompt-sub">Learn more about the Manawatū's prehistoric ecosystem!</div>
      <p>Move the switch on the left.</p>
    </div>
  </div>

  <!-- ============ HABITAT screen (forest/wetland/lowland/alpine) ============ -->
  <div id="habitatScreen" class="hidden">
    <h1 id="habitatTitle">Forest Habitat</h1>
    <div id="plantCluster"></div>

    <div id="card">
      <!-- prompt state -->
      <div id="cardPrompt">
        <img class="hand" src="assets/hand.png" alt="" aria-hidden="true"
             onerror="this.style.visibility='hidden'">
        <div class="prompt-title">Select a Plant</div>
        <div class="prompt-sub">Learn more about the Manawatū's prehistoric ecosystem!</div>
      </div>
      <!-- species state -->
      <div id="cardSpecies" class="hidden">
        <div id="cardFauna"></div>
        <img id="cardPlant" alt="">
        <div class="card-text">
          <h2 id="cardName"></h2>
          <div id="cardSci"></div>
          <p id="cardDesc"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ readout: KYA · stage · goal · timelapse ============ -->
  <div id="readout">
    <span id="clockLabel">waiting for the diorama…</span>
    <span id="stagePill" class="pill">—</span>
    <span id="goalLabel"></span>
    <span id="timelapse">
      <span id="timelapseTrack"><span id="timelapseFill"></span></span>
      <span id="timelapseMsg"></span>
    </span>
  </div>

  <!-- ============ optional on-screen test controls (?controls=1) ============ -->
  <div id="testbar">
    <button data-action="habitatUp">▲ habitat</button>
    <button data-action="habitatDown">▼ habitat</button>
    <button data-action="plantPrev">◀ plant</button>
    <button data-action="plantNext">plant ▶</button>
    <button data-action="storm">STORM</button>
    <button data-action="boost">BOOST</button>
    <button data-action="eruption">ERUPTION</button>
  </div>

</div>

<!-- load order: data + bus + input before the app -->
<script src="encyclopedia.js"></script>
<script src="bus.js"></script>
<script src="input.js"></script>
<script src="app.js"></script>
</body>
</html>
